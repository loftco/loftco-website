<style>
  @font-face {
    font-family: 'OutfitLocal';
    src: url('vendor/Outfit-Variable.ttf') format('truetype');
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('vendor/Outfit-Variable.ttf') format('truetype');
    font-weight: 100 900;
    font-display: block;
  }
  :root {
    --paper: oklch(0.97 0.005 80);
    --ink: oklch(0.18 0.01 250);
    --stone: oklch(0.45 0.01 250);
    --accent: #002b7f;
    --legacy: #969ba5;                          /* blue-gray, lightly tinted toward Loftco blue: the unfinished state */
    --chrome: oklch(0.18 0.01 250 / 0.55);
    --rule: oklch(0.18 0.01 250 / 0.15);
  }
  :root[data-theme="dark"] {
    --paper: oklch(0.14 0.015 255);
    --ink: oklch(0.95 0.005 80);
    --stone: oklch(0.7 0.01 250);
    --accent: #5b8cff;
    --chrome: oklch(0.95 0.005 80 / 0.55);
    --rule: oklch(0.95 0.005 80 / 0.15);
  }
  :root[data-theme="blue"] {
    --legacy: #ffffff;                          /* white logo: build stage in white outlines, no gray */
    --paper: #002b7f;
    --ink: #ffffff;
    --stone: oklch(0.85 0.03 255);
    --accent: #ffffff;
    --chrome: oklch(1 0 0 / 0.6);
    --rule: oklch(1 0 0 / 0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Outfit', system-ui, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    transition: background 0.4s ease;
  }
  .stage {
    display: grid;
    place-items: center;
    padding: 16px;
    min-height: 0;
  }
  #logo {
    width: min(92vw, 860px);
    height: auto;
    overflow: visible;
  }
  .acc { fill: var(--accent); }
  .member, .build { stroke: var(--legacy); fill: none; }   /* unfinished = blue-gray */
  .lumber { fill: #c8964f; }
  .tiltup { position: fixed; pointer-events: none; z-index: 2; }
  .tiltCam { position: absolute; top: 0; height: 100%; }
  .tiltPanel { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 100%; }
  .tiltPanel svg { position: absolute; overflow: hidden; }   /* only this letter; placed to the sub-pixel by layoutTilt */
  .cable { stroke: var(--stone); fill: none; }
  .block { fill: var(--stone); }
  .ink { fill: var(--ink); }
  .stone { fill: var(--stone); }
  .wordch { font-family: 'OutfitLocal', 'Outfit', sans-serif; font-weight: 700; }
  .cheap { font-family: 'Outfit', sans-serif; stroke: var(--accent); stroke-linejoin: round; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
    justify-content: center;
    padding: 14px 16px 22px;
    border-top: 1px solid var(--rule);
    color: var(--chrome);
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .controls button {
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .controls button:hover, .controls button[aria-pressed="true"] {
    border-color: var(--ink);
  }
  .controls input[type="range"] {
    width: min(320px, 60vw);
    accent-color: var(--accent);
  }
  .embed body { background: transparent; display: block; }
  .embed .controls { display: none; }
  .embed .stage { padding: 0; height: 100vh; }
  .embed #logo { width: 100%; height: 100%; }
  .group { display: flex; gap: 6px; align-items: center; }
  .phase { min-width: 7.5em; text-align: left; font-variant-numeric: tabular-nums; }
</style>
</head>

  tl.eventCallback('onComplete', function () {
    loopsDone++;
    if (LOOPS && loopsDone >= LOOPS) { notifyDone(); return; }
    playLoopAfterHold();
  });

  scrub.addEventListener('input', function () {
    scrubbing = true;
    tl.pause();
    tl.seek(span[0] + (span[1] - span[0]) * scrub.value / 1000);
    setPlaying(false);
  });
  scrub.addEventListener('change', function () { scrubbing = false; });

  function setPlaying(on) {
    playBtn.textContent = on ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
  }
  playBtn.addEventListener('click', function () {
    if (tl.paused() || !tl.isActive()) {
      var atEnd = MODE === 'build' ? tl.time() >= loopStart - 0.001 : tl.progress() === 1;
      if (atEnd) tl.play(startAt); else tl.play();
      setPlaying(true);
    } else { tl.pause(); setPlaying(false); }
  });
  document.getElementById('btn-replay').addEventListener('click', function () {
    if (startAt === 0) tl.restart(); else tl.play(startAt);
    setPlaying(true);
  });
  document.querySelectorAll('[data-speed]').forEach(function (b) {
    b.addEventListener('click', function () {
      tl.timeScale(parseFloat(b.dataset.speed));
      document.querySelectorAll('[data-speed]').forEach(function (o) { o.setAttribute('aria-pressed', o === b); });
    });
  });
  document.querySelectorAll('button[data-theme]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.documentElement.setAttribute('data-theme', b.dataset.theme);
      document.querySelectorAll('button[data-theme]').forEach(function (o) { o.setAttribute('aria-pressed', o === b); });
    });
  });

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  tl.seek(loopStart).pause();                     // rest on the finished mark
  if (EMBED) {
    var seen = false;
    if (legacyIntro === 'once') { try { seen = sessionStorage.getItem('loftcoIntroSeen') === '1'; sessionStorage.setItem('loftcoIntroSeen', '1'); } catch (e) {} }
    if (!reduced) {
      if (MODE === 'loop' || seen) playLoopAfterHold();
      else tl.play(0);                            // build or both
    }
  } else if (reduced) {
    setPlaying(false);                            // Play runs it on request
  } else {
    tl.play(startAt);
    setPlaying(true);
  }

  svg.removeChild(probe);
  window.__mark = { tl: tl, geom: { rb: rb, nb: nb, tb: tb, fsW: fsW } };
})();
</script>
</body>
</html>
